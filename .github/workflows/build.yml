name: Build Prophorcel

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev

            - name: Configurer
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configurer (macOS universel)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Compiler
        run: cmake --build build --config Release --parallel

      - name: Récupérer le VST3
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/Prophorcel_artefacts/Release/VST3/Prophorcel.vst3 dist/ 2>/dev/null \
            || cp -R build/Prophorcel_artefacts/VST3/Prophorcel.vst3 dist/
          ls -R dist | head -20

      - name: Tester le plugin (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          codesign --force --deep -s - dist/Prophorcel.vst3
          codesign --verify --deep --strict --verbose=2 dist/Prophorcel.vst3
          file dist/Prophorcel.vst3/Contents/MacOS/Prophorcel
          python3 -c "import ctypes; ctypes.CDLL('dist/Prophorcel.vst3/Contents/MacOS/Prophorcel'); print('dlopen OK')"
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests dist/Prophorcel.vst3

      - name: Publier le VST3
        uses: actions/upload-artifact@v4
        with:
          name: Prophorcel-VST3-${{ matrix.name }}
          path: dist
